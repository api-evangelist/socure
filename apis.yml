apis:
- aid: socure:socure-decision-api
  name: Socure Decision API
  tags:
  - Decisioning
  - Rules Engine
  - Identity Verification
  humanURL: https://developer.socure.com/docs/id-plus/modules/decision
  properties:
  - url: https://developer.socure.com/docs/id-plus/modules/decision
    type: Documentation
  - url: openapi/socure-decision-api-openapi.yml
    type: OpenAPI
  description: >-
    Socure's rule-based decisioning module returns a single deterministic outcome — accept, reject, review,
    refer, or resubmit — derived from ID+ module scores and customer-configured rules. Decision rules
    are authored in the Socure Console and applied on every ID+ call when the `decision.module` block
    is included in the request modules array.
- aid: socure:socure-account-intelligence-api
  name: Socure Account Intelligence API
  tags:
  - Bank Account Verification
  - Account Validation
  - Open Banking
  humanURL: https://developer.socure.com/docs/id-plus/modules/account-intelligence
  properties:
  - url: https://developer.socure.com/docs/id-plus/modules/account-intelligence
    type: Documentation
  - url: openapi/socure-account-intelligence-api-openapi.yml
    type: OpenAPI
  description: >-
    Real-time validation of US bank accounts — verifying open/closed status, ownership (name match), and
    account-type signals. Powers funding-account checks for fintech onboarding, payroll, and ACH origination
    flows without requiring micro-deposits or end-user credentials.
- aid: socure:socure-riskos-api
  name: Socure RiskOS API
  tags:
  - Orchestration
  - Workflows
  - Identity Verification
  - Fraud Prevention
  humanURL: https://help.socure.com/riskos/docs
  properties:
  - url: https://help.socure.com/riskos/docs
    type: Documentation
  description: >-
    RiskOS is Socure's identity and fraud orchestration platform that combines ID+ modules, customer-configured
    workflows, case management, and a no-code rules editor under a unified API. RiskOS Enterprise supports
    custom workflow deployments; RiskOS Launch is the self-serve productized workflow offering. Note -
    the RiskOS API surface is gated behind customer onboarding; this profile tracks the documentation
    entry point only.
